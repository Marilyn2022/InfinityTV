name: Sync upstream LunaTV

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-lunatv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream and open or update a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MoonTechLab/LunaTV.git
          git fetch origin main
          git fetch upstream main

          git checkout -B sync/upstream origin/main

          # -X ours resolves conflicting hunks in favor of this fork, while
          # still applying upstream changes that do not conflict locally.
          if ! git merge --no-commit --no-ff -X ours upstream/main; then
            git merge --abort || true
            echo "Upstream merge failed. Resolve the conflict manually." >&2
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            # Keep InfinityTV's custom utility and version files, even when
            # the merge did not produce a conflict for them.
            git checkout HEAD -- src/lib/utils.ts src/lib/version.ts

            # Apply upstream's compatibility behavior for legacy Douban proxy values.
            python3 - <<'PY'
          from pathlib import Path

          path = Path("src/lib/utils.ts")
          content = path.read_text(encoding="utf-8")
          replacements = {
              "if (storedType === 'direct') {": "if (storedType === 'direct' || storedType === 'img3') {",
              "const effectiveRuntimeType = (runtimeType === 'direct') ? 'server' : runtimeType;": "const effectiveRuntimeType = (runtimeType === 'direct' || runtimeType === 'img3') ? 'server' : runtimeType;",
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f"Expected Douban proxy logic not found: {old}")
              content = content.replace(old, new, 1)
          path.write_text(content, encoding="utf-8")
          PY

            git add src/lib/utils.ts src/lib/version.ts
            git commit --no-edit
          fi

          if git diff --quiet origin/main HEAD; then
            echo "Local main is already up to date with upstream."
            exit 0
          fi

          git push --force origin HEAD:refs/heads/sync/upstream

          existing_pr=$(gh pr list --head sync/upstream --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head sync/upstream \
              --title "chore: sync latest LunaTV upstream" \
              --body "Automated sync from https://github.com/MoonTechLab/LunaTV. Conflicting hunks were kept in favor of this fork; please review before merging."
          else
            echo "Updated existing upstream sync pull request #$existing_pr."
          fi
