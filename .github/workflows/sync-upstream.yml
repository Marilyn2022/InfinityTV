name: Sync upstream LunaTV

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream and open or update a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MoonTechLab/LunaTV.git
          git fetch origin main
          git fetch upstream main

          git checkout -B sync/upstream origin/main

          if ! git merge --no-edit upstream/main; then
            conflicts=$(git diff --name-only --diff-filter=U)
            unexpected=""

            while IFS= read -r conflict; do
              [ -z "$conflict" ] && continue

              case "$conflict" in
                src/lib/utils.ts|src/lib/version.ts)
                  ;;
                *)
                  unexpected="${unexpected}${conflict}"$'\n'
                  ;;
              esac
            done <<< "$conflicts"

            if [ -z "$conflicts" ] || [ -n "$unexpected" ]; then
              git merge --abort || true
              echo "Upstream merge has conflicts outside the known local customizations:" >&2
              if [ -n "$unexpected" ]; then
                printf '%s' "$unexpected" >&2
              else
                echo "(No unmerged files were detected.)" >&2
              fi
              echo "Resolve them manually." >&2
              exit 1
            fi

            # Keep InfinityTV's custom utility and version files when they conflict.
            if printf '%s\n' "$conflicts" | grep -Fxq "src/lib/utils.ts"; then
              git checkout --ours -- src/lib/utils.ts

              # Preserve compatibility with legacy Douban proxy values.
              python3 - <<'PY'
          from pathlib import Path

          path = Path("src/lib/utils.ts")
          content = path.read_text()
          replacements = {
              "if (storedType === 'direct') {":
                  "if (storedType === 'direct' || storedType === 'img3') {",
              "const effectiveRuntimeType = (runtimeType === 'direct') ? 'server' : runtimeType;":
                  "const effectiveRuntimeType = (runtimeType === 'direct' || runtimeType === 'img3') ? 'server' : runtimeType;",
          }

          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f"Expected Douban proxy logic not found: {old}")
              content = content.replace(old, new, 1)

          path.write_text(content)
          PY
            fi

            if printf '%s\n' "$conflicts" | grep -Fxq "src/lib/version.ts"; then
              git checkout --ours -- src/lib/version.ts
            fi

            git add -- src/lib/utils.ts src/lib/version.ts
            git commit --no-edit
          fi

          if git diff --quiet origin/main HEAD; then
            echo "Local main is already up to date with upstream."
            exit 0
          fi

          git push --force origin HEAD:refs/heads/sync/upstream

          existing_pr=$(gh pr list --head sync/upstream --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head sync/upstream \
              --title "chore: sync latest LunaTV upstream" \
              --body "Automated sync from https://github.com/MoonTechLab/LunaTV. Please review before merging."
          else
            echo "Updated existing upstream sync pull request #$existing_pr."
          finame: Sync upstream LunaTV

